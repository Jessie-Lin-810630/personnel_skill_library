[project]
name = "06-personnel-skill-library"
version = "0.1.0"
description = ""
authors = [
    {name = "Jessie_lin",email = "lucky460721@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "pymongo (>=4.17.0,<5.0.0)",
    "python-frontmatter (>=1.1.0,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "requests (>=2.33.1,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "pygsheet (>=0.1.19b25,<0.2.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "openai (>=2.38.0,<3.0.0)",
    "streamlit[auth] (>=1.64.0,<2.0.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "google-cloud-storage (>=3.10.1,<4.0.0)",
    "google-genai (>=2.9.0,<3.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "markdown (>=3.10.2,<4.0.0)",
    "flask (>=3.1.3,<4.0.0)",
    "rapidfuzz (>=3.14.5,<4.0.0)",
    "cohere (>=7.0.4,<8.0.0)",
    "pygsheets (>=2.0.6,<3.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "pyjwt (>=2.15.0,<3.0.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.0,<5.0.0)",
    "ruff (==0.15.19)"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
# 關掉「強制每處都要有 docstring」的 presence 規則，保留「有寫的 docstring 要格式正確」
# D415：要求摘要以標點結尾，但只認半形 .!?，不認中文全形「。」，對中文 docstring 必然誤判，停用
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E402"]             # 測試不要求 docstring 格式；E402 為 sys.path 先設定再 import 的刻意寫法
"dashboard_ui/app.py" = ["E402"]      # E402 為 ARROW_DEFAULT_MEMORY_POOL 需早於 pyarrow import 的刻意寫法
"**/__init__.py" = ["D104", "F401"]   # 套件入口檔放寬

[tool.ruff.lint.pydocstyle]
convention = "google"
