name: Deploy task03-leetcode-ccClub-etl

on:
  push:
    branches: [develop]
    paths:
      - 'task03_leetcode_ccClub_etl/**'
      - 'docker/Dockerfile.task03'
      - 'requirements.txt'
      - '.github/workflows/deploy_task03_leetcode_ccClub_etl.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build and Push
        run: |
          docker build \
            --platform=linux/amd64 \
            -f docker/Dockerfile.task03 \
            -t asia-east1-docker.pkg.dev/causal-inquiry-484423-e7/personal-skill-dashboard/task03-leetcode-ccclub-etl:latest \
            .
          docker push asia-east1-docker.pkg.dev/causal-inquiry-484423-e7/personal-skill-dashboard/task03-leetcode-ccclub-etl:latest