name: Deploy dashboard-ui

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'dashboard_ui/**'
      - '.streamlit/**'
      - 'docker/Dockerfile.dashboard_ui'
      - 'requirements.txt'
      - '.github/workflows/deploy_dashboard_ui.yml'

env:
  REGION: asia-east1
  GCP_PROJECT: causal-inquiry-484423-e7
  AR_REPO: personal-skill-dashboard
  SERVICE_NAME: dashboard-ui

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 分支 main -> 環境 prod、其餘分支（develop）-> 環境 dev；SHORT_SHA 取 commit sha 前七碼
      # IMAGE 由上方 env 的 REGION／GCP_PROJECT／AR_REPO／SERVICE_NAME 組出
      - name: Resolve environment name, short SHA and image path
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV_NAME=prod" >> "$GITHUB_ENV"
          else
            echo "ENV_NAME=dev" >> "$GITHUB_ENV"
          fi
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/${SERVICE_NAME}" >> "$GITHUB_ENV"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      # 同一份 image 貼三個 tag：不可變的 <sha>、環境浮動的 <env>-latest、可回滾的 <env>-<sha>
      - name: Build and Push
        run: |
          docker build \
            --platform=linux/amd64 \
            -f docker/Dockerfile.dashboard_ui \
            -t "${IMAGE}:${SHORT_SHA}" \
            -t "${IMAGE}:${ENV_NAME}-latest" \
            -t "${IMAGE}:${ENV_NAME}-${SHORT_SHA}" \
            .
          docker push "${IMAGE}:${SHORT_SHA}"
          docker push "${IMAGE}:${ENV_NAME}-latest"
          docker push "${IMAGE}:${ENV_NAME}-${SHORT_SHA}"

      # 審查頁要打的是同環境的 Silver／Gold，故部署前先查出兩者實際 URL
      - name: Resolve Silver and Gold endpoint URLs
        run: |
          SILVER_BASE=$(gcloud run services describe "task07-silver-service-${ENV_NAME}" \
            --region "${REGION}" --project "${GCP_PROJECT}" --format='value(status.url)')
          GOLD_BASE=$(gcloud run services describe "task07-gold-service-${ENV_NAME}" \
            --region "${REGION}" --project "${GCP_PROJECT}" --format='value(status.url)')
          echo "SILVER_ENDPOINT_URL=${SILVER_BASE}/enrich" >> "$GITHUB_ENV"
          echo "GOLD_ENDPOINT_URL=${GOLD_BASE}/archive" >> "$GITHUB_ENV"

      # 部署一律指定完整不可變 tag；前端對外開放，登入由頁面的角色帳密控管
      - name: Deploy to Cloud Run Service
        run: |
          gcloud run deploy "${SERVICE_NAME}-${ENV_NAME}" \
            --image "${IMAGE}:${ENV_NAME}-${SHORT_SHA}" \
            --region "${REGION}" \
            --project "${GCP_PROJECT}" \
            --service-account person-skill-dashboard@${GCP_PROJECT}.iam.gserviceaccount.com \
            --port 8080 \
            --memory 1Gi \
            --concurrency 4 \
            --allow-unauthenticated \
            --set-env-vars "SILVER_ENDPOINT_URL=${SILVER_ENDPOINT_URL},GOLD_ENDPOINT_URL=${GOLD_ENDPOINT_URL}" \
            --set-secrets MONGO_ALTAS_URI=MONGO_ALTAS_URI:latest,MONGO_DB_NAME=MONGO_DB_NAME:latest,GCP_PROJECT_ID=GCP_PROJECT_ID:latest,COHERE_API_KEY=COHERE_API_KEY:latest,ERD_LINK=ERD_LINK:latest,AI_AGENT_RATE_LIMIT=AI_AGENT_RATE_LIMIT:latest,ROLE_ML_USERNAME=ROLE_ML_USERNAME:latest,ROLE_ML_PASSWORD=ROLE_ML_PASSWORD:latest,ROLE_OWNER_USERNAME=ROLE_OWNER_USERNAME:latest,ROLE_OWNER_PASSWORD=ROLE_OWNER_PASSWORD:latest,ROLE_SENIOR_USERNAME=ROLE_SENIOR_USERNAME:latest,ROLE_SENIOR_PASSWORD=ROLE_SENIOR_PASSWORD:latest,ROLE_GUEST_USERNAME=ROLE_GUEST_USERNAME:latest,ROLE_GUEST_PASSWORD=ROLE_GUEST_PASSWORD:latest
