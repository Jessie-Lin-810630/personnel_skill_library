name: Deploy task01-obsidian-etl

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'task01_obsidian_etl_v2/**'
      - 'docker/Dockerfile.task01'
      - 'requirements.txt'
      - '.github/workflows/deploy_task01_obsidian_etl.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build and Push
        run: |
          docker build \
            --platform=linux/amd64 \
            -f docker/Dockerfile.task01 \
            -t asia-east1-docker.pkg.dev/causal-inquiry-484423-e7/personal-skill-dashboard/task01-obsidian-etl:latest \
            .
          docker push asia-east1-docker.pkg.dev/causal-inquiry-484423-e7/personal-skill-dashboard/task01-obsidian-etl:latest

      - name: Deploy to Cloud Run Job
        run: |
          gcloud run jobs deploy task01-obsidian-etl \
            --image asia-east1-docker.pkg.dev/causal-inquiry-484423-e7/personal-skill-dashboard/task01-obsidian-etl:latest \
            --region asia-east1 \
            --project causal-inquiry-484423-e7 \
            --service-account psd-task01@causal-inquiry-484423-e7.iam.gserviceaccount.com \
            --set-secrets MONGO_ALTAS_URI=MONGO_ALTAS_URI:latest,MONGO_DB_NAME=MONGO_DB_NAME:latest
